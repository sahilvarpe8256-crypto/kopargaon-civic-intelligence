version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: kopargaon-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: kopargaon_civic_intelligence
    volumes:
      - mongo_data:/data/db
    networks:
      - kopargaon-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Express Backend API & Priority Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kopargaon-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/kopargaon_civic_intelligence
      - JWT_SECRET=kopargaon_civic_intelligence_jwt_secret_dev_key
      - JWT_EXPIRES_IN=7d
      - AI_MODE=mock
      - GEMINI_MODEL=gemini-2.0-flash
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173
      - MAX_FILE_SIZE_MB=10
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - kopargaon-network

  # React Frontend Web App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kopargaon-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - kopargaon-network

volumes:
  mongo_data:
  backend_uploads:

networks:
  kopargaon-network:
    driver: bridge